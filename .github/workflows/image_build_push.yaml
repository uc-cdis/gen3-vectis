name: Build Image and Push to Quay

# The production portal image (Dockerfile.production only). A merge to main revs the version (vectisprodv1.0.1, v1.0.2, ...); the Monday run
# rebuilds the current version on the weekend-patched base images and publishes it again under the same tag. vectisprodv1.0 always points at
# the newest version.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  Security:
    name: Security Pipeline
    uses: uc-cdis/.github/.github/workflows/securitypipeline.yaml@master
    with:
      python-poetry: 'false'
    secrets: inherit # pragma: allowlist-secret

  version:
    name: Work out the version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: A merge to main revs the version (1.0.1, 1.0.2, ...); the weekly run keeps the current one
        id: next
        env:
          # The release line. Change it to 2.0 to start a 2.x line (the first merge then makes 2.0.1).
          RELEASE_LINE: "1.0"
          MERGE: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          last=$(git tag --list "v${RELEASE_LINE}.*" | sed "s/^v${RELEASE_LINE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ "${MERGE}" = "true" ]; then
            version="${RELEASE_LINE}.$(( ${last:-0} + 1 ))"
            git tag "v${version}"
            git push origin "v${version}"
          elif [ -n "${last}" ]; then
            version="${RELEASE_LINE}.${last}"
          else
            version="${RELEASE_LINE}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  ci:
    name: Build Image and Push to Quay
    needs: version
    uses: uc-cdis/.github/.github/workflows/image_build_push_native.yaml@master
    with:
      USE_QUAY_ONLY: true
      DOCKERFILE_LOCATION: Dockerfile.production
      OVERRIDE_TAG_NAME: vectisprodv${{ needs.version.outputs.version }}
    secrets:
      ECR_AWS_ACCESS_KEY_ID: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
      ECR_AWS_SECRET_ACCESS_KEY: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}

  move-release-line-tag:
    name: Point vectisprod-v<line> at this build
    needs: [version, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: The moving tag (the one the CDK config and the gitops values name) follows the newest version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          line="$(echo "${VERSION}" | cut -d. -f1,2)"
          if [ "${line}" = "${VERSION}" ]; then exit 0; fi
          docker buildx imagetools create \
            -t "quay.io/cdis/gen3-vectis:vectisprodv${line}" \
            "quay.io/cdis/gen3-vectis:vectisprodv${VERSION}"
